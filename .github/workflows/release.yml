name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config patchelf \
            libgl1-mesa-dev libglu1-mesa-dev \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install sdl2 sdl2_image sdl2_mixer sdl3 pkg-config

      - name: Install Windows toolchain
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-SDL2_image
            mingw-w64-ucrt-x86_64-SDL2_mixer
            mingw-w64-ucrt-x86_64-python

      - name: Build
        if: runner.os != 'Windows'
        run: make

      - name: Build Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: make USE_SDL=1

      - name: Package
        if: runner.os != 'Windows'
        run: python3 scripts/package_release.py

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: python3 scripts/package_release.py

      - uses: actions/upload-artifact@v4
        with:
          name: excitebike-${{ runner.os }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md << 'EOF'
          Builds for Windows, Linux, and macOS.

          Extract the archive for your system and run the game from that folder. It loads images and sounds from `assets/` next to the executable.
          EOF
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "${GITHUB_REF_NAME}" \
            --notes-file notes.md
